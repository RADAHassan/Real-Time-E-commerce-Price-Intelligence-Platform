name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Python: lint + test + dbt compile ───────────────────────────────────
  python:
    name: Python lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run tests
        env:
          USE_MOCK_DATA: "true"
          GCP_PROJECT_ID: "test-project"
        run: pytest tests/ -v --tb=short --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: dbt compile (no DB connection)
        run: |
          pip install dbt-bigquery --quiet
          cd dbt_project
          dbt deps
          dbt compile --profiles-dir . \
            --vars '{"project_id": "ci-project", "dataset": "ci_dataset"}'
        continue-on-error: true   # dbt needs a valid profile; compile may warn

  # ─── Frontend: build + typecheck ─────────────────────────────────────────
  frontend:
    name: React build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # ─── Docker build check (all images) ─────────────────────────────────────
  docker:
    name: Docker build — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [python, frontend]

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
          - name: sink
            dockerfile: docker/sink.Dockerfile
          - name: frontend
            dockerfile: docker/frontend.Dockerfile
          - name: dashboard        # was missing — Dockerfile created in audit fix
            dockerfile: docker/dashboard.Dockerfile
          - name: airflow          # was missing — needed for scraper production image
            dockerfile: docker/airflow.Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: price-intelligence-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Spider sanity check ──────────────────────────────────────────────────
  scrapers:
    name: Spider validation
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check spiders list
        run: scrapy list
        working-directory: .

      - name: Crawl books (2 pages, cached — no real HTTP)
        run: scrapy crawl books_spider -s MAX_PAGES=2 -s HTTPCACHE_ENABLED=true -s ROBOTSTXT_OBEY=false
        working-directory: .
        continue-on-error: true   # network might be unavailable in CI
