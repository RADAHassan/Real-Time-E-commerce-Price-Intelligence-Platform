apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: price-intelligence
  labels:
    app: price-intelligence
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: price-intelligence
        component: api
    spec:
      serviceAccountName: price-intelligence-sa
      containers:
        - name: api
          image: price-intelligence-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: platform-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: price-intelligence
spec:
  selector:
    component: api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
