apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: price-intelligence
data:
  GCP_PROJECT_ID: ""                          # set at deploy time with --set-string
  BIGTABLE_INSTANCE_ID: "price-intelligence"
  BIGQUERY_DATASET: "price_intelligence_raw"
  BIGQUERY_LOCATION: "US"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SCRAPY_LOG_LEVEL: "INFO"
  SCRAPY_DOWNLOAD_DELAY: "2"
  NIFI_PUSH_ENABLED: "false"
  BIGTABLE_PUSH_ENABLED: "false"
  KAFKA_PUSH_ENABLED: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: price-intelligence
type: Opaque
stringData:
  # Override these at deploy time — never commit real values.
  GCP_SA_KEY_JSON: ""
